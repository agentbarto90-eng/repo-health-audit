name: Full audit request

# A `paid-audit` issue is a customer asking for the £29 report. There is no
# payment credential wired up yet, so this workflow does not take money: it
# acknowledges the request with the exact next step and keeps the intent in one
# place. Replace the payment step once a real Stripe Payment Link exists.

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  acknowledge:
    if: contains(github.event.issue.labels.*.name, 'paid-audit')
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge the request, once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          # `opened` and `labeled` can both fire for the same issue, so post the
          # acknowledgement only if it is not already there.
          if gh issue view "$ISSUE_NUMBER" --json comments \
               --jq '.comments[].body' | grep -qF "Thanks for asking about the full £29 audit"; then
            echo "Already acknowledged; nothing to do."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Thanks for asking about the full £29 audit. It covers every finding written up in severity order, ready-to-file issue drafts with labels, and a fix pack you can review and commit.
          Next step: payment is not automated yet, so this issue is the record of your request. A real Stripe Payment Link is being wired up; when it is live, the pay button on the offer page and this issue will both point at it. Nothing is charged here and no card details are needed.
          Read-only: the audit reads public GitHub data and never writes to your repository."
