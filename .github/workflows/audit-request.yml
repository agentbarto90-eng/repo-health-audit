name: Free repo health audit

# Fulfils the promise on the offer page: an issue labelled `audit-request`
# (which the request template applies automatically) triggers a read-only scan,
# and the report plus the ready-to-file issue checklist are posted back to the
# issue. Runs entirely on public GitHub data and the built-in GITHUB_TOKEN.

on:
  issues:
    types: [opened, labeled, edited]
  workflow_dispatch:
    inputs:
      repository:
        description: "Public repository to audit (owner/name)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-request-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'audit-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check whether this request was already answered
        id: guard
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json comments \
            --jq '[.comments[].body]' | python3 audit_reply.py guard \
            >> "$GITHUB_OUTPUT"

      - name: Resolve the requested repository and run the audit
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_REPO: ${{ inputs.repository }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 run_audit_request.py

      - name: Build the reply
        id: reply
        if: steps.scan.outputs.ok == 'true'
        env:
          REPO: ${{ steps.scan.outputs.repo }}
        run: |
          python3 -c "import os,audit_reply as ar; open('reply.md','w').write(ar.build_reply(os.environ['REPO'], open('report.md').read()))"

      - name: Post the report back to the issue
        if: >
          steps.scan.outputs.ok == 'true' &&
          github.event_name != 'workflow_dispatch' &&
          steps.guard.outputs.needs_report == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file reply.md

      - name: Explain a failed request
        if: >
          steps.scan.outputs.ok != 'true' &&
          github.event_name != 'workflow_dispatch' &&
          steps.guard.outputs.needs_failure == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 -c "import audit_reply as ar; open('reply.md','w').write(ar.failure_reply())"
          gh issue comment "$ISSUE_NUMBER" --body-file reply.md

      - name: Upload the report as an artifact
        if: steps.scan.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.run_id }}
          path: report.md
